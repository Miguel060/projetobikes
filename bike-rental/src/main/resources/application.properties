spring.application.name=bike-rental
server.port=8080

# Banco H2 em arquivo (persiste em ./data)
spring.datasource.url=jdbc:h2:file:./data/bikerental
spring.datasource.username=sa
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
# Timezone e locale pt-BR
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.locale=pt-BR
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.web.locale=pt-BR
spring.web.locale-resolver=fixed

# JWT (em produção, defina JWT_SECRET com pelo menos 32 caracteres)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=120

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
