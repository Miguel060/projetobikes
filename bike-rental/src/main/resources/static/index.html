<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aluguel de Bicicletas</title>
<style>
  :root { --ink:#1b2422; --muted:#667370; --line:#e3e8e6; --bg:#fbfcfb; --accent:#0f766e; --warn:#b45309; --bad:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width:960px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:20px; margin:0; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:12px; justify-content:space-between; margin-bottom:20px; }
  header .user { color:var(--muted); display:flex; gap:12px; align-items:center; }
  nav { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:20px; }
  nav button { background:none; border:0; border-bottom:2px solid transparent; padding:8px 14px; color:var(--muted); cursor:pointer; font:inherit; }
  nav button[aria-current="true"] { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
  button, input, select { font:inherit; }
  input, select { padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); min-width:0; }
  button.primary { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; }
  button.ghost { background:none; border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; color:var(--ink); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .row > input, .row > select { flex:1 1 160px; }
  .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:#fff; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { font-weight:600; color:var(--muted); font-size:13px; }
  tr:last-child td { border-bottom:0; }
  td.actions { text-align:right; }
  .tag { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid currentColor; }
  .DISPONIVEL, .FINALIZADA { color:var(--accent); }
  .ALUGADA, .ATIVA { color:var(--warn); }
  .MANUTENCAO { color:var(--muted); }
  .empty { padding:20px; color:var(--muted); text-align:center; }
  #msg { min-height:22px; margin-bottom:12px; color:var(--bad); }
  #msg.ok { color:var(--accent); }
  #login { max-width:320px; margin:12vh auto 0; }
  #login form { display:grid; gap:10px; margin-top:16px; }
  .hint { color:var(--muted); font-size:13px; margin-top:12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <section id="login">
    <h1>Aluguel de Bicicletas</h1>
    <form id="f-login">
      <input name="username" placeholder="Usuário" autocomplete="username" required>
      <input name="password" type="password" placeholder="Senha" autocomplete="current-password" required>
      <button class="primary">Entrar</button>
    </form>
    <p class="hint">Demonstração: admin / admin123 ou cliente / cliente123</p>
    <p id="login-msg" class="hint" style="color:var(--bad)"></p>
  </section>

  <section id="app" hidden>
    <header>
      <h1>Aluguel de Bicicletas</h1>
      <div class="user"><span id="who"></span><button class="ghost" id="logout">Sair</button></div>
    </header>
    <nav id="tabs"></nav>
    <div id="msg" role="status"></div>
    <div id="content"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
